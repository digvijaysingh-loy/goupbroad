version: '3.9'

services:

  client:
    container_name: client
    build:
      context: ./client
      dockerfile: docker/production/Dockerfile
      args:
        VITE_PUBLIC_FIREBASE_API_KEY: ${VITE_PUBLIC_FIREBASE_API_KEY}
        VITE_PUBLIC_FIREBASE_AUTH_DOMAIN: ${VITE_PUBLIC_FIREBASE_AUTH_DOMAIN}
        VITE_PUBLIC_FIREBASE_PROJECT_ID: ${VITE_PUBLIC_FIREBASE_PROJECT_ID}
        VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        VITE_PUBLIC_FIREBASE_MEASUREMENT_ID: ${VITE_PUBLIC_FIREBASE_MEASUREMENT_ID}
        VITE_PUBLIC_FIREBASE_STORAGE_BUCKET: ${VITE_PUBLIC_FIREBASE_STORAGE_BUCKET}
        VITE_PUBLIC_FIREBASE_APP_ID: ${VITE_PUBLIC_FIREBASE_APP_ID}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_SERVER_URL: ${VITE_SERVER_URL}      
    restart: always
    env_file:
      - ./.env.production
    ports:
      - 5173:80
    depends_on:
      - server
    networks:
      - queue-net

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: docker/production/Dockerfile
    env_file:
      - ./.env.production
    ports:
      - '5000:5000'
    networks:
      - queue-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/usr/share/nginx/html
      - /etc/ssl/goupbroad/fullchain.pem:/etc/letsencrypt/live/goupbroad.com/fullchain.pem:ro
      - /etc/ssl/goupbroad/privkey.pem:/etc/letsencrypt/live/goupbroad.com/privkey.pem:ro   
    restart: always
    networks:
      - queue-net
    depends_on:
      - server
      - client

networks:
  queue-net:
    driver: bridge

volumes:
  mongo-data: