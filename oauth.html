<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google OAuth Flow Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #e5e7eb;
    }

    .card {
      background: #020617;
      border-radius: 18px;
      padding: 32px 28px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    }

    .card h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .card p.subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .google-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      background: #f9fafb;
      color: #111827;
      transition: transform 0.1s ease, box-shadow 0.1s ease,
        background 0.1s ease;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.4);
      text-decoration: none;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.7);
      background: #ffffff;
    }

    .google-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.4);
    }

    .google-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: conic-gradient(
        from 180deg,
        #4285f4 0deg 90deg,
        #34a853 90deg 180deg,
        #fbbc05 180deg 270deg,
        #ea4335 270deg 360deg
      );
    }

    .status {
      margin-top: 18px;
      font-size: 0.9rem;
      min-height: 1.3em;
    }

    .status.success {
      color: #4ade80;
    }

    .status.warning {
      color: #fde68a;
    }

    .status.error {
      color: #f97373;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.5);
      margin-top: 8px;
      gap: 6px;
    }

    .pill span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #4ade80;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #6b7280;
      line-height: 1.4;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      background: #020617;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Google Login Test</h1>
    <p class="subtitle">
      Hit your backend's <code>/auth/google</code> route and complete the full OAuth flow.
    </p>

    <!-- We’ll inject href with JS so we can include the current page in "state" -->
    <a id="googleLoginBtn" class="google-btn" href="#">
      <span class="google-icon"></span>
      <span>Continue with Google</span>
    </a>

    <div id="status" class="status"></div>
    <div id="extra" class="hint"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const extraEl = document.getElementById("extra");
    const loginBtn = document.getElementById("googleLoginBtn");

    // Set the /auth/google URL and pass this page as "state"
    (function init() {
      const currentUrl = window.location.origin + window.location.pathname;
      const state = encodeURIComponent(currentUrl);

      // Assuming backend and frontend are same origin.
      // If not, replace "" with your API base (e.g. "http://localhost:5000")
      const backendBase = "http://localhost:5004/v1"; 
      loginBtn.href = backendBase + "/auth/google?state=" + state;

      handleRedirectResult();
    })();

    function handleRedirectResult() {
      const params = new URLSearchParams(window.location.search);
      const message = params.get("message");
      const requiresPayment = params.get("requiresPayment");
      const error = params.get("error");

      if (error) {
        statusEl.textContent = "❌ Authentication failed: " + decodeURIComponent(error);
        statusEl.classList.add("error");
        return;
      }

      if (message) {
        statusEl.textContent = "✅ " + decodeURIComponent(message);
        statusEl.classList.add("success");

        if (requiresPayment === "true") {
          extraEl.innerHTML = `
            <div class="pill">
              <span class="dot"></span>
              <span>Payment required</span>
            </div>
            <br/><br/>
            Redirect the user to your payment page here in your real app.
          `;
        } else {
          extraEl.textContent =
            "You can consider the user logged in now. The backend has already set an httpOnly cookie.";
        }

        return;
      }

      statusEl.textContent =
        "Not authenticated yet. Click the button above to start Google login.";
      statusEl.classList.add("warning");
    }
  </script>
</body>
</html>
